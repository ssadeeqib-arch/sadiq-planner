pens."},{id:"q-103",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-'Asr",ref:"103:1–3",text:"By time — humanity is surely in loss, except those who believe, do good, and urge one another to truth and to patience.",themes:["time","community","patience"],apply:"Time is the asset you cannot buy back. Spend today's on what will still matter."},{id:"q-66-6",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Tahrim",ref:"66:6",text:"O you who believe, protect yourselves and your families from a Fire…",themes:["family"],apply:"Your family's well-being — in this life and the next — is part of your duty, not an extra."},{id:"q-25-74",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Furqan",ref:"25:74",text:"Our Lord, grant us from our spouses and our children the coolness of our eyes, and make us leaders of the God-conscious.",themes:["family","community"],apply:"Make this your du'a today — then act like the leader you are asking to be."},{id:"q-28-77",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Qasas",ref:"28:77",text:"Seek the home of the Hereafter through what Allah has given you, but do not forget your share of this world; and do good as Allah has done good to you.",themes:["wealth","community"],apply:"Wealth is a means. Build it — and let it flow towards good."},{id:"q-62-10",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Jumu'ah",ref:"62:10",text:"When the prayer is ended, disperse in the land and seek of the bounty of Allah, and remember Allah often so that you may succeed.",themes:["wealth","career","push"],apply:"Worship, then work. Both are part of success."},{id:"q-65-2",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Talaq",ref:"65:2–3",text:"Whoever is mindful of Allah, He will make a way out for him and provide for him from where he does not expect.",themes:["wealth","trust"],apply:"Keep your income clean. Provision comes from directions you cannot yet see."},{id:"q-3-159",tradition:"quran",note:"meaning",source:"Qur'an, Surat Al 'Imran",ref:"3:159",text:"Once you have made a decision, put your trust in Allah.",themes:["trust","push","career"],apply:"Consult, decide — then commit. Indecision is its own kind of failure."},{id:"q-2-286",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Baqarah",ref:"2:286",text:"Allah does not burden a soul beyond what it can bear.",themes:["patience","trust"],apply:"What is on your plate is within your capacity. Carry it."},{id:"q-20-114",tradition:"quran",note:"meaning",source:"Qur'an, Surat Taha",ref:"20:114",text:"And say: My Lord, increase me in knowledge.",themes:["knowledge","growth","career"],apply:"Ask for knowledge — then make time to receive it today."},{id:"q-5-2",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Ma'idah",ref:"5:2",text:"Cooperate with one another in goodness and God-consciousness, and do not cooperate in sin and aggression.",themes:["community","career"],apply:"Choose your partners by this rule — in business and in life."},{id:"q-61-2",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Saff",ref:"61:2–3",text:"O you who believe, why do you say what you do not do? Most hateful to Allah is that you say what you do not do.",themes:["push","discipline"],apply:"You have written your goals down. Now close the gap between saying and doing."},{id:"q-17-23",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Isra'",ref:"17:23–24",text:"Be excellent to your parents… lower to them the wing of humility out of mercy, and say: My Lord, have mercy on them as they raised me when I was small.",themes:["family"],apply:"Your mother's comfort is worship. What can you do for her this week?"},{id:"q-2-261",tradition:"quran",note:"meaning",source:"Qur'an, Surat al-Baqarah",ref:"2:261",text:"Those who spend their wealth in the way of Allah are like a seed that grows seven ears, in every ear a hundred grains.",themes:["community","wealth"],apply:"Giving is not subtraction. It is planting."},{id:"h-muslim-2664",tradition:"hadith",source:"Sahih Muslim",ref:"2664",text:"The strong believer is better and more beloved to Allah than the weak believer, though there is good in both. Strive for what benefits you, seek Allah's help, and do not give up.",themes:["push","discipline","growth"],apply:`Strength is a choice made daily. Do the beneficial thing — and don't say "I can't".`},{id:"h-bukhari-6464",tradition:"hadith",source:"Sahih al-Bukhari",ref:"6464",text:"The deeds most beloved to Allah are those done consistently, even if they are small.",themes:["discipline","growth"],apply:"Fifteen minutes every day beats five hours once. Protect the streak."},{id:"h-bukhari-6412",tradition:"hadith",source:"Sahih al-Bukhari",ref:"6412",text:"There are two blessings in which many people are at a loss: health and free time.",themes:["time","push"],apply:"Free time today is a blessing to invest, not to scroll away."},{id:"h-bukhari-2072",tradition:"hadith",source:"Sahih al-Bukhari",ref:"2072",text:"No one has ever eaten better food than what he earned by the work of his own hands.",themes:["wealth","career"],apply:"Build what you own. Earned provision tastes different."},{id:"h-bukhari-1427",tradition:"hadith",source:"Sahih al-Bukhari",ref:"1427",text:"The upper hand is better than the lower hand.",themes:["wealth","community"],apply:"Work towards being the one who gives, not the one who needs."},{id:"h-bukhari-893",tradition:"hadith",source:"Sahih al-Bukhari",ref:"893",text:"All of you are guardians, and each of you is responsible for those in your care.",themes:["family","career","community"],apply:"Your family, your teams, your companies — you will be asked about each of them."},{id:"h-tirmidhi-3895",tradition:"hadith",source:"Jami' al-Tirmidhi",ref:"3895",text:"The best of you are those who are best to their families.",themes:["family"],apply:"Success abroad means little without excellence at home. Call home today."},{id:"h-tirmidhi-2517",tradition:"hadith",source:"Jami'
